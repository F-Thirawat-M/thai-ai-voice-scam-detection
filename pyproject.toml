[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-spoof"
version = "0.1.0"
description = "A beginner-friendly Thai synthetic speech detection research project"
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "soundfile>=0.12,<1",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
  "torch>=2,<3",
  "torchaudio>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
data = ["pyarrow>=15,<26"]
eda = [
  "huggingface-hub>=1,<3",
  "pyarrow>=15,<26",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
  "nbformat>=5,<6",
  "nbconvert>=7,<8",
  "ipykernel>=6,<8",
]

[project.scripts]
thai-spoof = "thai_spoof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"thai_spoof.aasist" = ["config.json", "README.md"]
"thai_spoof.rawnet2" = ["config.yaml", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
