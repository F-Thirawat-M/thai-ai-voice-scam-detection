[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thai-spoof"
version = "0.1.0"
description = "A beginner-friendly Thai synthetic speech detection research project"
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "soundfile>=0.12,<1",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
  "torch>=2,<3",
  "torchaudio>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
data = ["pyarrow>=15,<26"]

[project.scripts]
thai-spoof = "thai_spoof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
